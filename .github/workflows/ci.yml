name: CI

on: [push]

jobs:
  linux:
    name: 'Linux ${{matrix.name}}'
    runs-on: ${{matrix.os}}

    env:
      CMAKE_GENERATOR: 'Ninja Multi-Config'
      VERBOSE: 1
      CXX: ${{matrix.cxx}}
      CC: ${{matrix.cc}}
      ASAN_OPTIONS: 'detect_invalid_pointer_pairs=2:strict_string_checks=true:detect_odr_violation=2:detect_stack_use_after_return=true:check_initialization_order=true:strict_init_order=true:${{matrix.asan_options}}'
      UBSAN_OPTIONS: 'print_stacktrace=1:silence_unsigned_overflow=1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'clang 23'
            cxx: 'clang++-23'
            cc: 'clang-23'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_x64_options: >-
              -fsanitize=undefined,object-size
            sanitizer_options: >-
              -fsanitize=address,vptr,alignment,bool,builtin,bounds,enum,float-cast-overflow,float-divide-by-zero,function,integer-divide-by-zero,null,pointer-overflow,return,returns-nonnull-attribute,shift,shift-base,shift-exponent,unreachable
              -fno-sanitize-recover=all
              -ffp-exception-behavior=maytrap

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 23

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install ninja-build ${{matrix.packages}}

      - name: Configure CMake (sanitized)
        run: >-
          cmake -B build
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{matrix.options}} ${{matrix.sanitizer_options}} ${{matrix.sanitizer_x64_options}}"

      - name: Run tests (Debug)
        run: cmake --build build --config Debug --target run-option-test --parallel

      - name: Run tests (Release)
        run: cmake --build build --config Release --target run-option-test --parallel

      - name: Configure CMake (codegen, no sanitizers)
        run: >-
          cmake -B build-codegen
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{matrix.options}}"

      - name: Run codegen tests
        run: cmake --build build-codegen --config Release --target run-option-codegen-test --parallel

      - name: Configure CMake (x32, sanitized)
        run: >-
          cmake -B build-x32
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=-m32 ${{matrix.sanitizer_options}}"

      - name: Run tests (Debug x32)
        run: cmake --build build-x32 --config Debug --target run-option-test --parallel

      - name: Run tests (Release x32)
        run: cmake --build build-x32 --config Release --target run-option-test --parallel