name: CI

on: [push]

jobs:
  linux:
    name: 'Linux ${{matrix.name}}'
    runs-on: ${{matrix.os}}

    env:
      CMAKE_GENERATOR: 'Ninja Multi-Config'
      VERBOSE: 1
      CXX: ${{matrix.cxx}}
      CC: ${{matrix.cc}}
      # detect_invalid_pointer_pairs=2 produces false positives related to std::less
      ASAN_OPTIONS: 'detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:detect_container_overflow=1:detect_invalid_pointer_pairs=1:halt_on_error=1:abort_on_error=1:strict_init_order=1:handle_ioctl=1:print_cmdline=1:disable_coredump=0:use_madv_dontdump=1'
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1:print_summary=1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'clang 23'
            cxx: 'clang++-23'
            cc: 'clang-23'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,leak,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr -fsanitize-address-use-after-return=runtime
              -fno-sanitize-recover=all

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM 23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 23

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install ninja-build ${{matrix.packages}}

      - name: Configure CMake (sanitized)
        run: >-
          cmake -B build
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{matrix.options}} ${{matrix.sanitizer_options}} ${{matrix.sanitizer_x64_options}}"

      - name: Run tests (Debug)
        run: cmake --build build --config Debug --target run-option-test --parallel

      - name: Run tests (Release)
        run: cmake --build build --config Release --target run-option-test --parallel

      - name: Configure CMake (codegen, no sanitizers)
        run: >-
          cmake -B build-codegen
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{matrix.options}}"

      - name: Run codegen tests
        run: cmake --build build-codegen --config Release --target run-option-codegen-test --parallel

      - name: Configure CMake (x32, sanitized)
        run: >-
          cmake -B build-x32
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=-m32 ${{matrix.sanitizer_options}}"

      - name: Run tests (Debug x32)
        run: cmake --build build-x32 --config Debug --target run-option-test --parallel

      - name: Run tests (Release x32)
        run: cmake --build build-x32 --config Release --target run-option-test --parallel