name: CI

on: [push]

jobs:
  linux:
    name: 'Linux ${{matrix.name}}'
    runs-on: ${{matrix.os}}

    env:
      CMAKE_GENERATOR: 'Ninja Multi-Config'
      VERBOSE: 1
      CXX: ${{matrix.cxx}}
      CC: ${{matrix.cc}}
      ASAN_OPTIONS: ${{ matrix.asan_options }}
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1:print_summary=1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'clang 23'
            llvm: '23'
            cxx: 'clang++-23'
            cc: 'clang-23'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'

          - name: 'clang 22'
            llvm: '22'
            cxx: 'clang++-22'
            cc: 'clang-22'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'

          - name: 'clang 21'
            llvm: '21'
            cxx: 'clang++-21'
            cc: 'clang-21'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM ${{ matrix.llvm }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install ${{matrix.packages}}

      - name: Configure CMake (sanitized)
        run: >-
          cmake -B build
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{matrix.options}} ${{matrix.sanitizer_options}}"

      - name: Run tests (Debug)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}${{ matrix.debug_asan_options }}
        run: cmake --build build --config Debug --target run-option-test --parallel

      - name: Run tests (Release)
        run: cmake --build build --config Release --target run-option-test --parallel

      - name: Configure CMake (codegen, no sanitizers)
        run: >-
          cmake -B build-codegen
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{matrix.options}}"

      - name: Run codegen tests
        run: cmake --build build-codegen --config Release --target run-option-codegen-test --parallel

      - name: Configure CMake (x32, sanitized)
        run: >-
          cmake -B build-x32
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=-m32 ${{matrix.sanitizer_options}}"

      - name: Run tests (Debug x32)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}${{ matrix.debug_asan_options }}
        run: cmake --build build-x32 --config Debug --target run-option-test --parallel

      - name: Run tests (Release x32)
        run: cmake --build build-x32 --config Release --target run-option-test --parallel
  msan:
    name: 'Linux clang 23 (msan)'
    runs-on: ubuntu-latest

    env:
      CMAKE_GENERATOR: 'Ninja Multi-Config'
      VERBOSE: 1
      CXX: clang++-23
      CC: clang-23
      MSAN_OPTIONS: 'abort_on_error=1:poison_in_dtor=1'

    steps:
      - *checkout_step

      - name: Install LLVM 23
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh 23

      - name: Resolve libc++ source revision
        id: llvm_ref
        run: echo "sha=$(git ls-remote https://github.com/llvm/llvm-project.git refs/heads/release/23.x | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache MSan-instrumented libc++
        id: msan_libcxx
        uses: actions/cache@v6.1.0
        with:
          path: msan-prefix
          key: libcxx-msan-23-x86_64-${{ steps.llvm_ref.outputs.sha }}

      - name: Build MSan-instrumented libc++
        if: steps.msan_libcxx.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release/23.x https://github.com/llvm/llvm-project.git
          cmake -B libcxx-msan -S llvm-project/runtimes -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DCMAKE_C_COMPILER=clang-23 \
            -DCMAKE_CXX_COMPILER=clang++-23 \
            -DLLVM_USE_SANITIZER=MemoryWithOrigins \
            -DLIBCXXABI_USE_LLVM_UNWINDER=OFF `#fixes the crash` \
            -DLLVM_ENABLE_PIC=ON \
            -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXXABI_INCLUDE_TESTS=OFF \
            -DLIBUNWIND_INCLUDE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/msan-prefix
          cmake --build libcxx-msan --parallel
          cmake --install libcxx-msan

      - name: Configure CMake (msan)
        run: >-
          cmake -B build-msan
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=-fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls -nostdinc++ -isystem $GITHUB_WORKSPACE/msan-prefix/include/c++/v1"
          "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -L$GITHUB_WORKSPACE/msan-prefix/lib -Wl,-rpath,$GITHUB_WORKSPACE/msan-prefix/lib -lc++abi"

      - name: Run tests (Debug)
        run: cmake --build build-msan --config Debug --target run-option-test --parallel

      - name: Run tests (Release)
        run: cmake --build build-msan --config Release --target run-option-test --parallel