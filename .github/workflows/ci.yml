name: CI

on: [push]

jobs:
  linux:
    name: 'Linux ${{matrix.name}}'
    runs-on: ${{matrix.os}}

    env:
      CMAKE_GENERATOR: 'Ninja Multi-Config'
      VERBOSE: 1
      CXX: ${{matrix.cxx}}
      CC: ${{matrix.cc}}
      UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1:print_summary=1'
      TYSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      MSAN_OPTIONS: 'abort_on_error=1:poison_in_dtor=1'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'clang 23'
            llvm: '23'
            cxx: 'clang++-23'
            cc: 'clang-23'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2' # only in debug since in release code gets inlined and -fsanitize-ignorelist doesnt work reliably anymore
            tysan_options: -fsanitize=type -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 22'
            llvm: '22'
            cxx: 'clang++-22'
            cc: 'clang-22'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            tysan_options: -fsanitize=type -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 21'
            llvm: '21'
            cxx: 'clang++-21'
            cc: 'clang-21'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            tysan_options: -fsanitize=type -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 20'
            llvm: '20'
            cxx: 'clang++-20'
            cc: 'clang-20'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            # TypeSanitizer only since clang 20
            tysan_options: -fsanitize=type -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 19'
            llvm: '19'
            cxx: 'clang++-19'
            cc: 'clang-19'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 18'
            llvm: '18'
            cxx: 'clang++-18'
            cc: 'clang-18'
            packages: 'g++-multilib'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 17'
            llvm: '17'
            cxx: 'clang++-17'
            cc: 'clang-17'
            # i386 compiler-rt is required for -m32 AddressSanitizer; the amd64 package does not ship libclang_rt.asan-i386.a
            packages: 'g++-multilib libclang-rt-17-dev libclang-rt-17-dev:i386'
            os: 'ubuntu-latest'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 16'
            llvm: '16'
            cxx: 'clang++-16'
            cc: 'clang-16'
            packages: 'g++-multilib'
            os: 'ubuntu-22.04' # LLVM 16 is no longer published for ubuntu-latest (24.04) on apt.llvm.org so we're using ubuntu-22.04 where the llvm.sh installation still works
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 15'
            llvm: '15'
            cxx: 'clang++-15'
            cc: 'clang-15'
            packages: 'g++-multilib'
            os: 'ubuntu-22.04'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

          - name: 'clang 14'
            llvm: '14'
            cxx: 'clang++-14'
            cc: 'clang-14'
            packages: 'g++-multilib'
            os: 'ubuntu-22.04'
            options: '--stdlib=libstdc++'
            sanitizer_options: >-
              -fno-omit-frame-pointer -fno-optimize-sibling-calls
              -fsanitize=address,undefined,float-divide-by-zero,unsigned-integer-overflow,implicit-conversion,local-bounds,nullability,pointer-compare,pointer-subtract,vptr
              -fsanitize-address-use-after-scope -fsanitize-address-use-after-return=always -fsanitize-address-use-odr-indicator
              -fno-sanitize-recover=all
              -fsanitize-ignorelist=$GITHUB_WORKSPACE/sanitizer-ignorelist.txt
            asan_options: 'abort_on_error=1:alloc_dealloc_mismatch=1:check_initialization_order=1:detect_odr_violation=2:intercept_tls_get_addr=1:quarantine_size_mb=512:malloc_context_size=30:max_free_fill_size=4096:max_malloc_fill_size=4096'
            debug_asan_options: ':detect_invalid_pointer_pairs=2'
            msan_options: -fsanitize=memory -fsanitize-memory-track-origins=2 -fsanitize-memory-use-after-dtor -fsanitize-memory-param-retval -fno-omit-frame-pointer -fno-optimize-sibling-calls

    steps:
      - &checkout_step
        name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install LLVM ${{ matrix.llvm }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x ./llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install ${{ matrix.packages }}

      - name: Configure CMake (sanitized)
        run: >-
          cmake -B build-sanitizers
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{ matrix.options }} ${{ matrix.sanitizer_options }}"

      - name: Run tests (sanitized, Debug)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}${{ matrix.debug_asan_options }}
        run: cmake --build build-sanitizers --config Debug --target run-option-test --parallel

      - name: Run tests (sanitized, Release)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
        run: cmake --build build-sanitizers --config Release --target run-option-test --parallel

      - name: Configure CMake (unsanitized)
        run: >-
          cmake -B build-standard
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{ matrix.options }}"

      - name: Run tests (unsanitized, Debug)
        run: cmake --build build-sanitizers --config Debug --target run-option-test --parallel

      - name: Run tests (unsanitized, Release)
        run: cmake --build build-sanitizers --config Release --target run-option-test --parallel

      - name: Run codegen tests
        run: cmake --build build-standard --config Release --target run-option-codegen-test --parallel

      - name: Configure CMake (TypeSanitizer)
        if: matrix.tysan_options
        run: >-
          cmake -B build-tysan
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{ matrix.options }} ${{ matrix.tysan_options }}"

      - name: Run tests (TypeSanitizer, Debug)
        if: matrix.tysan_options
        run: cmake --build build-tysan --config Debug --target run-option-test --parallel

      - name: Run tests (TypeSanitizer, Release)
        if: matrix.tysan_options
        run: cmake --build build-tysan --config Release --target run-option-test --parallel

      - name: Configure CMake (x32, sanitized)
        run: >-
          cmake -B build-x32
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=-m32 ${{matrix.sanitizer_options}}"

      - name: Run tests (sanitized, Debug x32)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}${{ matrix.debug_asan_options }}
        run: cmake --build build-x32 --config Debug --target run-option-test --parallel

      - name: Run tests (sanitized, Release x32)
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
        run: cmake --build build-x32 --config Release --target run-option-test --parallel

      - name: Resolve libc++ source revision (LLVM ${{ matrix.llvm }})
        id: llvm_ref
        run: echo "sha=$(git ls-remote https://github.com/llvm/llvm-project.git refs/heads/release/${{ matrix.llvm }}.x | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache MemorySanitizer-instrumented libc++
        id: msan_libcxx
        uses: actions/cache@v6.1.0
        with:
          path: msan-prefix
          key: libcxx-msan-${{ matrix.llvm }}-x86_64-${{ steps.llvm_ref.outputs.sha }}

      - name: Build MemorySanitizer-instrumented libc++
        if: steps.msan_libcxx.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch release/${{ matrix.llvm }}.x https://github.com/llvm/llvm-project.git
          cmake -B libcxx-msan -S llvm-project/runtimes -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_RUNTIMES="libcxx;libcxxabi;libunwind" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DLLVM_USE_SANITIZER=MemoryWithOrigins \
            -DLIBCXXABI_USE_LLVM_UNWINDER=OFF `#fixes the crash` \
            -DLLVM_ENABLE_PIC=ON \
            -DLIBCXX_INCLUDE_TESTS=OFF \
            -DLIBCXXABI_INCLUDE_TESTS=OFF \
            -DLIBUNWIND_INCLUDE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/msan-prefix
          cmake --build libcxx-msan --parallel
          cmake --install libcxx-msan

      - name: Configure CMake (MemorySanitizer)
        run: >-
          cmake -B build-msan
          -DCMAKE_CXX_STANDARD_REQUIRED=TRUE
          -DCMAKE_CXX_EXTENSIONS=FALSE
          "-DCMAKE_CXX_FLAGS=${{ matrix.msan_options }} -nostdinc++ -isystem $GITHUB_WORKSPACE/msan-prefix/include/c++/v1"
          "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -L$GITHUB_WORKSPACE/msan-prefix/lib -Wl,-rpath,$GITHUB_WORKSPACE/msan-prefix/lib -lc++abi"

      - name: Run tests (MemorySanitizer, Debug)
        run: cmake --build build-msan --config Debug --target run-option-test --parallel

      - name: Run tests (MemorySanitizer, Release)
        run: cmake --build build-msan --config Release --target run-option-test --parallel